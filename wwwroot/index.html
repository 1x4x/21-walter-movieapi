<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MovieApi</title><style>*{box-sizing:border-box}body{background:#0d1117;color:#e6edf3;font:16px system-ui;margin:0}header,main{padding:24px;max-width:1100px;margin:auto}header{border-bottom:1px solid #30363d}h1{color:#c4a7ff}section,article{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;margin:12px 0}button,input,select,textarea{background:#21262d;color:#eee;border:1px solid #484f58;border-radius:7px;padding:10px;margin:4px}button{cursor:pointer;background:#6339a6}textarea{width:100%;height:160px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a78bfa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}</style><header><h1>🎬 MovieApi</h1><p>.NET 10 · Entity Framework Core · SQLite</p><a href="/openapi/v1.json">OpenAPI specification</a></header><main><h2>Movie library</h2><input id="genre" placeholder="Genre"><input id="year" type="number" placeholder="Year"><input id="actor" placeholder="Actor"><button onclick="load()">Search</button><div id="movies" class="grid"></div><section><h2>API explorer</h2><select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option></select><input id="url" value="/api/movies" size="40"><button onclick="send()">Execute</button><textarea id="body">{"title":"New movie","year":2026,"genre":"Drama","duration":100}</textarea><pre id="result"></pre></section><section><h2>Reports</h2><div id="reports"></div></section></main><script>const $=id=>document.getElementById(id);async function load(){try{let q=new URLSearchParams();for(let k of ['genre','year','actor'])if($(k).value)q.set(k,$(k).value);let r=await fetch('/api/movies?'+q);if(!r.ok)throw Error(r.status);let data=await r.json();$('movies').replaceChildren();for(let m of data){let a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),b=document.createElement('button');h.textContent=m.title;p.textContent=m.year+' · '+m.genre+' · '+m.duration+' min';b.textContent='Details';b.onclick=()=>run('/api/movies/'+m.id+'/details');a.append(h,p,b);$('movies').append(a)}}catch(e){$('result').textContent=String(e)}}async function send(){try{let method=$('method').value,url=$('url').value;if(!url.startsWith('/api/'))throw Error('Use a local API path');let r=await fetch(url,{method,...(['POST','PUT'].includes(method)?{headers:{'Content-Type':'application/json'},body:$('body').value}:{})});let t=await r.text();try{t=JSON.stringify(JSON.parse(t),null,2)}catch{}$('result').textContent=r.status+' '+r.statusText+'\n'+t;if(method!=='GET'&&r.ok)load()}catch(e){$('result').textContent=String(e)}}function run(url){$('method').value='GET';$('url').value=url;send();$('result').scrollIntoView({behavior:'smooth'})}for(let r of ['movies/top5pergenre','movies/average-ratings','actors/most-active','movies/longest-per-country','movies/with-most-reviews','genres/popular']){let b=document.createElement('button');b.textContent=r;b.onclick=()=>run('/api/reports/'+r);$('reports').append(b)}load();</script></html>
